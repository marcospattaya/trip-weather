name: Fetch forecast

on:
  schedule:
    # 04:40, 11:40 and 17:40 in Vietnam and Thailand (UTC+7). GitHub can start these hours late,
    # so a push to refresh.txt also starts a run.
    - cron: "40 21 * * *"
    - cron: "40 4 * * *"
    - cron: "40 10 * * *"
  push:
    branches: [main]
    paths: ["points.json", "fetch.py", "refresh.txt", ".github/workflows/fetch.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the forecast
        run: python3 fetch.py
      - name: Save it
        run: |
          git config user.name "trip-weather"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
